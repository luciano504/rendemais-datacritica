<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#0F2B4C">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<title>Rende Mais · Data Crítica</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --navy:#0F2B4C; --navy2:#16395F; --bg:#F2F4F7; --card:#FFFFFF;
    --ink:#1C2733; --mut:#5B6B7C; --line:#E1E6EC; --accent:#1565C0;
    --ok:#2E7D32; --warn:#EF6C00; --danger:#C62828;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--ink); font-size:16px; padding-bottom:76px;}
  header{background:var(--navy); color:#fff; padding:14px 16px; position:sticky; top:0; z-index:20; display:flex; justify-content:space-between; align-items:center;}
  header h1{font-size:17px; font-weight:600;}
  header .sub{font-size:12px; opacity:.75; margin-top:2px;}
  .pillrole{background:rgba(255,255,255,.14); border-radius:20px; padding:4px 12px; font-size:12px; white-space:nowrap;}
  main{padding:14px; max-width:680px; margin:0 auto;}
  .card{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:12px;}
  .card h2{font-size:15px; font-weight:600; margin-bottom:10px; color:var(--navy);}
  label{display:block; font-size:13px; color:var(--mut); margin:10px 0 4px;}
  input,select{width:100%; padding:12px; border:1px solid var(--line); border-radius:10px; font-size:16px; background:#fff; color:var(--ink);}
  input:focus,select:focus{outline:2px solid var(--accent); border-color:transparent;}
  button{width:100%; padding:14px; border:none; border-radius:12px; font-size:16px; font-weight:600; cursor:pointer; margin-top:12px;}
  .btn-p{background:var(--navy); color:#fff;}
  .btn-s{background:#E8EEF5; color:var(--navy);}
  .btn-ok{background:var(--ok); color:#fff;}
  .btn-danger{background:var(--danger); color:#fff;}
  .btn-sm{width:auto; padding:8px 14px; font-size:13px; margin-top:8px; margin-right:6px;}
  .row{display:flex; gap:10px;} .row>*{flex:1;}
  nav{position:fixed; bottom:0; left:0; right:0; background:#fff; border-top:1px solid var(--line); display:flex; z-index:30;}
  nav button{margin:0; border-radius:0; background:none; color:var(--mut); font-size:12px; font-weight:500; padding:10px 4px 12px; display:flex; flex-direction:column; align-items:center; gap:3px;}
  nav button.on{color:var(--navy); font-weight:700;}
  nav button .ic{font-size:20px; line-height:1;}
  .badge{display:inline-block; padding:3px 10px; border-radius:20px; font-size:12px; font-weight:700; color:#fff;}
  .badge-loja{display:inline-block; padding:2px 7px; border-radius:6px; font-size:11px; font-weight:800; color:#fff; letter-spacing:.3px; margin-right:6px;}
  .chip{display:inline-flex; align-items:center; gap:6px; padding:8px 14px; border:1px solid var(--line); border-radius:20px; background:#fff; color:var(--ink); font-size:13px; font-weight:600; cursor:pointer; white-space:nowrap; margin:0; width:auto;}
  .chip.chip-on{background:var(--navy); color:#fff; border-color:var(--navy);}
  .chip-n{background:rgba(0,0,0,.08); color:inherit; border-radius:10px; padding:1px 7px; font-size:11px; font-weight:700;}
  .chip.chip-on .chip-n{background:rgba(255,255,255,.2);}
  .item{display:flex; justify-content:space-between; align-items:center; gap:10px; padding:12px 0; border-bottom:1px solid var(--line);}
  .item:last-child{border-bottom:none;}
  .item .t{font-weight:600; font-size:15px;}
  .item .s{font-size:12.5px; color:var(--mut); margin-top:2px;}
  .num{font-size:22px; font-weight:700;}
  .kpis{display:flex; gap:10px; margin-bottom:12px;}
  .kpi{flex:1; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px; text-align:center;}
  .kpi .v{font-size:19px; font-weight:800; color:var(--navy);}
  .kpi .l{font-size:11px; color:var(--mut); margin-top:3px; line-height:1.3;}
  .kpi.red .v{color:var(--danger);}
  .alertbox{border-radius:12px; padding:12px 14px; font-size:14px; margin-bottom:12px; font-weight:500;}
  .a-red{background:#FDE8E8; color:#8E1B1B; border:1px solid #F5C1C1;}
  .a-green{background:#E7F4E8; color:#1E5B22; border:1px solid #BFE3C2;}
  .a-blue{background:#E7F0FB; color:#123E6B; border:1px solid #C3D9F2;}
  .daybar{height:6px; border-radius:3px; margin-top:6px;}
  .muted{color:var(--mut); font-size:13px;}
  .center{text-align:center;}
  .hidden{display:none;}
  .price-big{font-size:26px; font-weight:800; color:var(--navy);}
  .strike{text-decoration:line-through; color:var(--mut); font-weight:500; font-size:16px;}
  pre{white-space:pre-wrap; font-family:ui-monospace,Menlo,monospace; font-size:12px; background:#F7F9FB; border:1px solid var(--line); border-radius:10px; padding:12px; margin-top:10px;}
  #scanbox{width:100%; border-radius:12px; background:#000; display:none; margin-top:10px; max-height:280px; object-fit:cover;}
  .grp-date{font-size:13px; font-weight:700; color:var(--navy); margin:16px 0 4px; display:flex; align-items:center; gap:8px;}
  .back{background:none; border:none; color:#fff; font-size:22px; width:auto; padding:0 10px 0 0; margin:0; cursor:pointer;}
  h3.sec{font-size:13px; text-transform:uppercase; letter-spacing:.6px; color:var(--mut); margin:18px 0 8px;}
  .ress{background:var(--navy); color:#fff; border-radius:14px; padding:14px 16px; margin-bottom:12px; display:flex; justify-content:space-between; align-items:center;}
  .ress .v{font-size:22px; font-weight:800;}
  .ress .l{font-size:12px; opacity:.8;}
  #loader{position:fixed; inset:0; background:rgba(255,255,255,.7); display:none; align-items:center; justify-content:center; z-index:50; font-weight:700; color:var(--navy);}
</style>
</head>
<body>
<header>
  <div style="display:flex; align-items:center;">
    <button class="back hidden" id="btnBack" onclick="goBack()">‹</button>
    <div>
      <h1 id="hTitle">Rende Mais · Data Crítica</h1>
      <div class="sub" id="hSub">Controle de mercadorias próximas do vencimento</div>
    </div>
  </div>
  <div class="pillrole hidden" id="hRole"></div>
</header>
<main id="view"><div class="card center muted">Carregando…</div></main>
<nav id="nav" class="hidden"></nav>
<div id="loader">Salvando…</div>

<script>
/* ================= CONFIG ================= */
const SUPABASE_URL = "https://estciwkeihmokvlnvaum.supabase.co";
const SUPABASE_KEY = "sb_publishable_l14fjxQmWUeu5OXlZJ35GA_-X3ESkgZ";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const LOJAS = {L01:"L01 Veneza",L02:"L02 Máximo",L03:"L03 Royal",L04:"L04 Lojão",L05:"L05 Alvorada",L08:"L08 Tradição",L09:"L09 Massangana"};
const LOJA_COR = {L01:"#1976D2", L02:"#388E3C", L03:"#C2185B", L04:"#E91E63", L05:"#F57C00", L08:"#7B1FA2", L09:"#00838F"};
function badgeLoja(cod){ return `<span class="badge-loja" style="background:${LOJA_COR[cod]||'#607D8B'}">${cod}</span>`; }
const PAPEIS = {operador:"Operador",prevencao:"Prevenção de perdas",gestor:"Gestor",fornecedor:"Fornecedor"};
const JANELA_SEG = 5, DEGRAU = 0.15, UPLIFT = 0.30, MAX_DEGRAUS = 3, DIAS_VMD = 14;

let sess = null;
let route = {page:"login", param:null, prev:[]};
let cache = {usuarios:[], lotes:[], produtos:{}, plojas:{}, hist:{}, vendas:{}};

/* ================= UTIL ================= */
function hoje(){ return new Date().toISOString().slice(0,10); }
function diasAte(v){ const a=new Date(hoje()+"T12:00"), b=new Date(v+"T12:00"); return Math.round((b-a)/86400000); }
function brl(n){ return (Number(n)||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"}); }
function fmtData(v){ const [y,m,d]=String(v).slice(0,10).split("-"); return d+"/"+m+"/"+y; }
async function sha256(t){
  const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(t));
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");
}
function loading(on){ document.getElementById("loader").style.display = on?"flex":"none"; }
function erroDB(e){ console.error(e); alert("Falha de comunicação com o banco: "+(e.message||e)+"\nVerifique a internet e tente de novo."); }

const BUCKETS = [
  {max:0,label:"Vence hoje",cor:"#7F0000"},{max:1,label:"1 dia",cor:"#B71C1C"},
  {max:3,label:"3 dias",cor:"#D32F2F"},{max:5,label:"5 dias",cor:"#E64A19"},
  {max:10,label:"10 dias",cor:"#EF6C00"},{max:15,label:"15 dias",cor:"#F57F17"},
  {max:20,label:"20 dias",cor:"#F9A825"},{max:30,label:"30 dias",cor:"#9E9D24"},
  {max:45,label:"45 dias",cor:"#558B2F"},{max:60,label:"60 dias",cor:"#2E7D32"}
];
function bucket(d){ if(d>60) return {label:"+60 dias",cor:"#78909C"}; for(const b of BUCKETS) if(d<=b.max) return b; return BUCKETS[BUCKETS.length-1]; }

/* ================= DADOS ================= */
async function carregarUsuarios(){
  const {data,error} = await sb.from("usuarios").select("id,nome,papel,loja").eq("ativo",true).order("nome");
  if(error) throw error;
  cache.usuarios = data;
}
async function carregarEansForn(){
  const idsF = String(sess.ids_fornecedor || sess.id_fornecedor || "").split(",").map(x=>parseInt(x)).filter(Boolean);
  if(!idsF.length){ cache.eansForn = new Set(); return; }
  const {data} = await sb.from("produtos_loja").select("ean").in("id_fornecedor", idsF);
  cache.eansForn = new Set((data||[]).map(p=>p.ean));
}
async function carregarSugestoes(){
  try{
    const {data} = await sb.from("sugestoes_fornecedor").select("*").eq("status","pendente").order("criado_em");
    cache.sugestoes = data||[];
  }catch(e){ cache.sugestoes = []; }
}
async function carregarLotes(){
  let q = sb.from("lotes").select("*, produtos(descricao,secao)").eq("resolvido",false).order("validade");
  if(nivel(sess.papel)<3 && sess.papel!=="fornecedor") q = q.eq("loja", sess.loja);
  const {data,error} = await q;
  if(error) throw error;
  cache.lotes = data;
  // dados por loja dos produtos envolvidos
  const eans = [...new Set(data.map(l=>l.ean))];
  cache.plojas = {};
  if(eans.length){
    const {data:pl,error:e2} = await sb.from("produtos_loja").select("*").in("ean",eans);
    if(e2) throw e2;
    pl.forEach(p=>{ cache.plojas[p.ean+"|"+p.loja]=p; });
    const corte = new Date(Date.now()-DIAS_VMD*86400000).toISOString().slice(0,10);
    const {data:vd,error:e3} = await sb.from("vendas_dia").select("ean,loja,qtd").in("ean",eans).gte("data",corte);
    if(e3) throw e3;
    cache.vendas = {};
    vd.forEach(v=>{ const k=v.ean+"|"+v.loja; cache.vendas[k]=(cache.vendas[k]||0)+Number(v.qtd); });
  }
}
async function carregarHist(loteId){
  const {data,error} = await sb.from("precos_hist").select("*").eq("lote_id",loteId).order("criado_em");
  if(error) throw error;
  cache.hist[loteId] = data;
  return data;
}
function ploja(ean,loja){ return cache.plojas[ean+"|"+loja] || null; }
function vendaDiaria(lote){
  const v14 = cache.vendas[lote.ean+"|"+lote.loja];
  if(v14!==undefined) return Math.max(v14/DIAS_VMD, 0.1);
  const pl = ploja(lote.ean, lote.loja);
  if(pl && pl.vmd14>0) return Number(pl.vmd14);
  return 0.5;
}
function precoNormal(lote){
  const h = cache.hist[lote.id];
  if(h && h.length) return Number(h[0].preco);
  const pl = ploja(lote.ean, lote.loja);
  return pl && pl.preco_venda ? Number(pl.preco_venda) : Number(lote.preco_atual)||0;
}
function sugestaoPreco(lote){
  const dias = diasAte(lote.validade), janela = Math.max(dias-JANELA_SEG,0);
  const vd = vendaDiaria(lote), rest = Number(lote.qtd_restante);
  const custo = (ploja(lote.ean,lote.loja)||{}).ultimo_custo || 0;
  if(rest <= vd*janela) return {ok:true, vd, janela, msg:"Projeção indica que o lote zera a tempo. Manter preço atual."};
  let preco = Number(lote.preco_atual)||precoNormal(lote), vdE = vd, n = 0;
  while(n < MAX_DEGRAUS){ n++; preco*=(1-DEGRAU); vdE*=(1+UPLIFT); if(vdE*janela>=rest) break; }
  return {ok:false, vd, vdE, janela, degraus:n, preco:Math.max(preco, Number(custo)||0),
    msg:"No ritmo atual ("+vd.toFixed(1)+"/dia) não zera a tempo. Sugerido "+n+"× desconto de 15%."};
}
function ressarcLote(lote){
  const h = cache.hist[lote.id]; if(!h||!h.length) return 0;
  const pn = Number(h[0].preco);
  return h.reduce((a,r)=> a + Math.max(0, pn-Number(r.preco))*Number(r.vendido), 0);
}
function custoRisco(lote){
  const pl = ploja(lote.ean,lote.loja);
  return Number(lote.qtd_restante) * (pl? Number(pl.ultimo_custo)||0 : 0);
}
function sugestaoTransf(lote){
  const out=[];
  for(const lj of Object.keys(LOJAS)){
    if(lj===lote.loja) continue;
    const pl = ploja(lote.ean, lj);
    if(!pl) continue;
    const vmd = Number(pl.vmd14)||0.1;
    const cob = Number(pl.estoque)/Math.max(vmd,0.1);
    if(cob<20) out.push({loja:lj, cobertura:Math.round(cob)});
  }
  return out.sort((a,b)=>a.cobertura-b.cobertura).slice(0,3);
}

/* ================= NAVEGAÇÃO ================= */
function nivel(p){ return {operador:1,prevencao:2,gestor:3,fornecedor:0}[p] ?? 0; }
function home(){ return sess.papel==="fornecedor"?"fornhome":(sess.papel==="gestor"?"gestor":(sess.papel==="prevencao"?"calendario":"contagem")); }
function go(page,param){ route.prev.push({page:route.page,param:route.param}); route.page=page; route.param=param; render(); }
function goBack(){ const p=route.prev.pop()||{page:home(),param:null}; route.page=p.page; route.param=p.param; render(); }
function logout(){ sess=null; stopScan(); localStorage.removeItem("dc_sess"); route={page:"login",param:null,prev:[]}; render(); }

function renderNav(){
  const n=document.getElementById("nav");
  if(!sess){ n.classList.add("hidden"); return; }
  n.classList.remove("hidden");
  if(sess && sess.papel==="fornecedor"){
    const nav=document.getElementById("nav");
    nav.innerHTML = [["fornhome","📦","Meus produtos"],["placas","🖨","Placas"],["sair","⏻","Sair"]].map(t=>
      `<button class="${route.page===t[0]?'on':''}" onclick="${t[0]==='sair'?'logout()':`go('${t[0]}')`}"><span>${t[1]}</span>${t[2]}</button>`).join("");
    return;
  }
  const nSug = window.__nSug ? " ("+window.__nSug+")" : "";
  const tabs=[["contagem","📷","Contagem",1],["calendario","🗓","Calendário",2],["sugestoes","💡","Sugestões"+nSug,2],["placas","🖨","Placas",2],["gestor","📊","Gestão",3],["perdas","📉","Perdas",3],["fornec","💰","Fornec.",3],["cadastro","⚙️","Cadastro",3],["sair","⏻","Sair",1]];
  n.innerHTML = tabs.filter(t=>nivel(sess.papel)>=t[3])
    .map(t=>`<button class="${route.page===t[0]?'on':''}" onclick="${t[0]==='sair'?'logout()':`go('${t[0]}')`}"><span class="ic">${t[1]}</span>${t[2]}</button>`).join("");
}

async function render(){
  const v=document.getElementById("view");
  document.getElementById("btnBack").classList.toggle("hidden", route.prev.length===0 || route.page==="login");
  document.getElementById("hRole").classList.toggle("hidden", !sess);
  if(sess){ document.getElementById("hRole").textContent = PAPEIS[sess.papel];
    const lojaTxt = sess.papel==="gestor" ? "Todas as lojas" : (sess.papel==="fornecedor" ? "Portal do fornecedor" : LOJAS[sess.loja]);
    document.getElementById("hSub").textContent = sess.nome+" · "+lojaTxt; }
  else document.getElementById("hSub").textContent = "Controle de mercadorias próximas do vencimento";
  renderNav();
  // proteção: rotas exclusivas do gestor
  const rotasGestor = ["gestor","itemdet","relatorio","cadastro","usuario","fornec","fornecdet","perdas"];
  const rotasPrev = ["calendario","placas","retirada","sugestoes"];
  if(sess){
    if(rotasGestor.includes(route.page) && nivel(sess.papel)<3){
      v.innerHTML='<div class="alertbox a-red">🔒 Acesso restrito. Esta área é exclusiva do gestor.</div>';
      return;
    }
    if(rotasPrev.includes(route.page) && nivel(sess.papel)<2 && sess.papel!=="fornecedor"){
      v.innerHTML='<div class="alertbox a-red">🔒 Acesso restrito. Esta área é para Prevenção de perdas ou Gestor.</div>';
      return;
    }
  } else if(route.page!=="login"){
    route={page:"login",param:null,prev:[]}; renderNav();
  }
  if(sess && sess.papel==="fornecedor" && !["fornhome","placas"].includes(route.page)){
    route={page:"fornhome",param:null,prev:[]}; renderNav();
  }
  try{
    if(route.page==="login"){ await carregarUsuarios(); v.innerHTML = vLogin(); }
    else if(route.page==="contagem"){ await carregarLotes(); v.innerHTML = vContagem(); initScanUI(); }
    else if(route.page==="calendario"){ await carregarLotes(); v.innerHTML = vCalendario(); }
    else if(route.page==="retirada"){ await carregarLotes(); v.innerHTML = vRetirada(); initScanUI(); }
    else if(route.page==="placas"){ await carregarLotes(); await histTodos(); if(sess.papel==="fornecedor") await carregarEansForn(); v.innerHTML = vPlacas(); }
    else if(route.page==="fornhome"){ await carregarLotes(); await histTodos(); v.innerHTML = await vFornHome(); }
    else if(route.page==="gestor"){ await carregarLotes(); await histTodos(); await carregarSugestoes(); v.innerHTML = vGestor(); }
    else if(route.page==="itemdet"){ await carregarLotes(); await carregarSugestoes(); const l=cache.lotes.find(x=>x.id===route.param); if(l) await carregarHist(l.id); v.innerHTML = vItem(route.param); }
    else if(route.page==="sugestoes"){ v.innerHTML = '<div class="card center muted">Carregando sugestões…</div>'; await vSugestoes(); }
    else if(route.page==="relatorio"){ await carregarLotes(); await histTodos(); v.innerHTML = vRelatorio(); }
    else if(route.page==="cadastro"){ await carregarUsuarios(); v.innerHTML = await vCadastro(); }
    else if(route.page==="usuario"){ if(nivel(sess.papel)<3){ v.innerHTML='<div class="alertbox a-red">Acesso restrito ao gestor.</div>'; return; } v.innerHTML = vUsuario(route.param); carregarUsuarioEdit(route.param); }
    else if(route.page==="perdas"){ if(nivel(sess.papel)<3){ v.innerHTML='<div class="alertbox a-red">Acesso restrito ao gestor.</div>'; return; } v.innerHTML = '<div class="card center muted">Calculando…</div>'; await vPerdas(); }
    else if(route.page==="fornec"){ if(nivel(sess.papel)<3){ v.innerHTML='<div class="alertbox a-red">Acesso restrito ao gestor.</div>'; return; } v.innerHTML = '<div class="card center muted">Calculando…</div>'; await vFornec(); }
    else if(route.page==="fornecdet"){ if(nivel(sess.papel)<3){ v.innerHTML='<div class="alertbox a-red">Acesso restrito ao gestor.</div>'; return; } v.innerHTML = '<div class="card center muted">Carregando…</div>'; await vFornecDet(route.param); }
  }catch(e){ v.innerHTML = `<div class="alertbox a-red">⚠️ ${e.message||e}<br><button class="btn-s btn-sm" onclick="render()">Tentar de novo</button></div>`; }
}
async function histTodos(){
  const ids = cache.lotes.map(l=>l.id);
  cache.hist = {};
  if(!ids.length) return;
  const {data,error} = await sb.from("precos_hist").select("*").in("lote_id",ids).order("criado_em");
  if(error) throw error;
  data.forEach(h=>{ (cache.hist[h.lote_id]=cache.hist[h.lote_id]||[]).push(h); });
}

/* ================= LOGIN ================= */
function vLogin(){
  const ops = cache.usuarios.map(u=>`<option value="${u.id}">${u.nome} — ${PAPEIS[u.papel]} (${u.loja})</option>`).join("");
  return `
  <div class="card">
    <h2>Entrar</h2>
    <label>Usuário</label><select id="luser">${ops||'<option value="">Nenhum usuário cadastrado</option>'}</select>
    <label>PIN</label><input id="lpin" type="password" inputmode="numeric" placeholder="••••">
    <button class="btn-p" onclick="doLogin()">Entrar</button>
  </div>
  <div class="card">
    <h2>Novo usuário</h2>
    <p class="muted">Cadastro simples, apenas para registrar a responsabilidade das ações.</p>
    <label>Nome</label><input id="cnome" placeholder="Nome completo">
    <div class="row">

function setLojaContagem(v){ lojaContagem = v||null; render(); }
function initScanUI(){
  const ean=document.getElementById("ean");
  if(ean) ean.addEventListener("input", buscaProduto);
}
let prodAtual=null, catAtual=null;
async function buscaProduto(){
  const e=document.getElementById("ean").value.trim(), box=document.getElementById("pinfo");
  prodAtual=null; catAtual=null;
  if(e.length<8){ box.innerHTML=""; return; }
  const {data} = await sb.from("produtos").select("*").eq("ean",e).maybeSingle();
  if(data){
    prodAtual=data;
    const {data:pl} = await sb.from("produtos_loja").select("*").eq("ean",e).eq("loja",sess.loja).maybeSingle();
    const extra = pl? ` — preço ${brl(pl.preco_venda)} · estoque sistema: ${Number(pl.estoque)||0} un` : "";
    box.innerHTML=`<div class="alertbox a-blue" style="margin-top:10px;">✔ ${data.descricao}${extra}</div>`;
    return;
  }
  // não acompanhado ainda: busca no catálogo da rede (tolera catálogo vazio/ausente)
  let cat=null;
  try{
    let r = await sb.from("catalogo").select("*").eq("ean",e).maybeSingle();
    cat = r.data;
    if(!cat && /^0+/.test(e)){
      r = await sb.from("catalogo").select("*").eq("ean",e.replace(/^0+/,"")).maybeSingle();
      cat = r.data;
    }
  }catch(_){}
  if(cat){
    catAtual=cat;
    box.innerHTML=`<div class="alertbox a-blue" style="margin-top:10px;">✔ ${cat.descricao} <br><span class="muted">Novo no acompanhamento — será adicionado ao salvar. Preço, custo e estoque chegam na próxima sincronização com o VR.</span></div>`;
  } else {
    box.innerHTML=`<div class="alertbox a-red" style="margin-top:10px;">Produto não encontrado no catálogo da rede. Cadastre este EAN no VR Controller e aguarde a próxima sincronização (5h).</div>`;
  }
}
async function toggleScan(){
  const v=document.getElementById("scanbox");
  if(scanStream||zxReader){ stopScan(); return; }
  try{
    if("BarcodeDetector" in window){
      scanStream = await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}});
      v.srcObject=scanStream; v.style.display="block"; await v.play();
      const det = new BarcodeDetector({formats:["ean_13","ean_8","code_128"]});
      scanTimer = setInterval(async ()=>{
        try{ const codes=await det.detect(v);
          if(codes.length){ document.getElementById("ean").value=codes[0].rawValue; buscaProduto(); stopScan(); navigator.vibrate&&navigator.vibrate(80); }
        }catch(e){}
      }, 350);
    } else {
      // fallback iPhone/Safari: ZXing
      zxReader = new ZXing.BrowserMultiFormatReader();
      v.style.display="block";
      await zxReader.decodeFromVideoDevice(null, v, (res, err)=>{
        if(res){ document.getElementById("ean").value=res.getText(); buscaProduto(); stopScan(); navigator.vibrate&&navigator.vibrate(80); }
      });
    }
    document.getElementById("btnCam").textContent="✖ Fechar";
  }catch(err){
    stopScan();
    alert("Não consegui abrir a câmera ("+(err.message||err)+"). Verifique a permissão de câmera do navegador ou digite o EAN.");
  }
}
function stopScan(){
  clearInterval(scanTimer); scanTimer=null;
  if(scanStream){ scanStream.getTracks().forEach(t=>t.stop()); scanStream=null; }
  if(zxReader){ try{zxReader.reset();}catch(e){} zxReader=null; }
  const v=document.getElementById("scanbox"); if(v){ v.style.display="none"; v.srcObject=null; }
  const b=document.getElementById("btnCam"); if(b) b.textContent="📷 Câmera";
}
async function salvarContagem(){
  const ean=document.getElementById("ean").value.trim();
  const val=document.getElementById("val").value;
  const qtd=parseFloat(document.getElementById("qtd").value);
  const loja = sess.papel==="gestor" ? lojaContagem : sess.loja;
  if(!loja) return alert("Escolha a loja onde está contando.");
  if(!val || !(qtd>0)) return alert("Informe validade e quantidade.");
  loading(true);
  try{
    // auto-cadastro se o produto ainda não é acompanhado — só via catálogo do VR
    if(!prodAtual){
      if(!catAtual){
        loading(false);
        return alert("Produto não está no catálogo da rede. Cadastre-o no VR Controller e aguarde a sincronização (5h da manhã).");
      }
      const novo = {ean, id_produto:catAtual.id_produto, descricao:catAtual.descricao};
      const {data:pr,error:ep} = await sb.from("produtos").upsert(novo,{onConflict:"ean"}).select().single();
      if(ep) throw ep;
      prodAtual = pr;
    }
    // já existe lote ativo do mesmo produto nesta loja?
    const {data:existentes} = await sb.from("lotes").select("*")
      .eq("ean",ean).eq("loja",loja).eq("resolvido",false).eq("zerado",false);
    if(existentes && existentes.length){
      loading(false);
      const lote = existentes[0];  // pega o primeiro; raro ter múltiplos
      const opcao = prompt(
        `Já existe contagem aberta deste produto em ${LOJAS[loja]}:\n\n`+
        `• Quantidade atual: ${lote.qtd_restante} un\n`+
        `• Validade registrada: ${fmtData(lote.validade)}\n\n`+
        `Digite:\n`+
        `  1 = CORRIGIR quantidade para ${qtd}\n`+
        `  2 = SOMAR ${qtd} à quantidade existente\n`+
        `  (qualquer outra tecla) = CANCELAR`);
      if(opcao === "1"){
        loading(true);
        const {error} = await sb.from("lotes").update({
          qtd_inicial: qtd, qtd_restante: qtd, validade: val,
          criado_por: sess.id, criado_por_nome: sess.nome, criado_em: new Date().toISOString()
        }).eq("id", lote.id);
        if(error) throw error;
        alert(`Quantidade corrigida para ${qtd} un.`);
      } else if(opcao === "2"){
        loading(true);
        const nq = Number(lote.qtd_inicial) + qtd;
        const nr = Number(lote.qtd_restante) + qtd;
        const {error} = await sb.from("lotes").update({qtd_inicial: nq, qtd_restante: nr}).eq("id", lote.id);
        if(error) throw error;
        alert(`Quantidade somada. Agora: ${nr} un.`);
      } else {
        alert("Contagem cancelada.");
        return;
      }
      document.getElementById("ean").value=""; document.getElementById("val").value="";
      document.getElementById("qtd").value=""; document.getElementById("pinfo").innerHTML="";
      prodAtual=null; catAtual=null;
      loading(false); render(); return;
    }
    const pl = ploja(ean, loja) || (await sb.from("produtos_loja").select("*").eq("ean",ean).eq("loja",loja).maybeSingle()).data;
    const preco = pl? Number(pl.preco_venda) : null;
    const {data:lote,error} = await sb.from("lotes").insert({
      ean, loja, validade:val, qtd_inicial:qtd, qtd_restante:qtd,
      preco_atual:preco, criado_por:sess.id, criado_por_nome:sess.nome
    }).select().single();
    if(error) throw error;
    if(preco) await sb.from("precos_hist").insert({lote_id:lote.id, preco, aplicado_por:sess.id, aplicado_por_nome:sess.nome});
    const d=diasAte(val), b=bucket(d);
    alert("Salvo! "+prodAtual.descricao+" — vence em "+(d<=0?"HOJE":d+" dias")+" ("+b.label+").");
    document.getElementById("ean").value=""; document.getElementById("val").value="";
    document.getElementById("qtd").value=""; document.getElementById("pinfo").innerHTML="";
    prodAtual=null; catAtual=null;
  }catch(e){ erroDB(e); }
  loading(false); render();
}

function vCalendario(){
  const pendVenc = cache.lotes.filter(l=>diasAte(l.validade)<0 && !l.resolvido && Number(l.qtd_restante)>0);
  const zerados = cache.lotes.filter(l=>(l.zerado || (diasAte(l.validade)<0 && Number(l.qtd_restante)<=0)) && !l.resolvido);
  const ativos = cache.lotes.filter(l=>!l.zerado && Number(l.qtd_restante)>0 && diasAte(l.validade)>=0 && diasAte(l.validade)<=60);
  const grupos={};
  ativos.forEach(l=>{ (grupos[l.validade]=grupos[l.validade]||[]).push(l); });
  let html = pendVenc.map(l=>{
    const pl = ploja(l.ean,l.loja)||{};
    const custo = Number(pl.ultimo_custo)||0;
    return `<div class="alertbox" style="background:#FDECEA; border:1px solid #F5C6CB; color:#7A1E1E;">
      🗑 <b>${l.produtos?l.produtos.descricao:l.ean}</b> (${LOJAS[l.loja]}) <b>venceu em ${fmtData(l.validade)}</b> — ${Number(l.qtd_restante)} un na contagem.
      <div style="margin-top:10px;">
        <label>Quantidade realmente descartada</label>
        <input id="dq_${l.id}" type="number" inputmode="decimal" step="1" min="0" value="${Number(l.qtd_restante)}" style="margin-bottom:8px;">
        <label>Fotos do descarte — até 3 (câmera ou galeria)</label>
        <input id="df_${l.id}" type="file" accept="image/*" multiple capture="environment" style="margin-bottom:8px;">
        <button class="btn-p" style="margin-top:4px;" onclick="confirmarDescarte('${l.id}')">✓ Confirmar descarte e lançar ao fornecedor</button>
        <p class="muted" style="margin-top:6px;">Validação da Prevenção: a quantidade confirmada × custo (${custo?brl(custo):'custo pendente'}) vira dívida de ${pl.nome_fornecedor||'(fornecedor não identificado)'}. As fotos ficam no arquivo do fornecedor como comprovante.</p>
      </div></div>`;
  }).join("") + zerados.map(l=>{
    const pn = precoNormal(l);
    return `<div class="alertbox a-green">✅ <b>${l.produtos?l.produtos.descricao:l.ean}</b> (${LOJAS[l.loja]}) zerou a contagem crítica.
      ${pn?`Voltar ao preço normal de <b>${brl(pn)}</b>.`:''}
      <button class="btn-ok btn-sm" onclick="resolver('${l.id}')">Preço normalizado</button></div>`;
  }).join("");
  if(!Object.keys(grupos).length && !zerados.length) html+='<div class="card"><p class="muted">Nenhum item com data crítica nos próximos 60 dias.</p></div>';
  for(const [data,ls] of Object.entries(grupos)){
    const d=diasAte(data), b=bucket(d);
    html += `<div class="grp-date"><span class="badge" style="background:${b.cor}">${d<=0?"VENCE HOJE":"faltam "+d+" dias"}</span> ${fmtData(data)}</div>
    <div class="card" style="padding:6px 16px;">`+
    ls.map(l=>{
      const pn=precoNormal(l);
      const promo = l.preco_atual && pn && Number(l.preco_atual)<pn;
      return `<div class="item" onclick="${nivel(sess.papel)>=3?`go('itemdet','${l.id}')`:''}" style="${nivel(sess.papel)>=3?'cursor:pointer;':''}">
        <div style="flex:1;"><div class="t">${badgeLoja(l.loja)}${l.produtos?l.produtos.descricao:l.ean}</div>
          <div class="s">${LOJAS[l.loja]} · falta zerar <b>${Number(l.qtd_restante)}</b> de ${Number(l.qtd_inicial)} un ${promo?'· promo '+brl(l.preco_atual):''}</div>
          <div class="daybar" style="background:${b.cor}; width:${Math.min(100,Math.round(l.qtd_restante/l.qtd_inicial*100))}%;"></div></div>
        <div class="num" style="color:${b.cor}">${Number(l.qtd_restante)}</div>
      </div>`;
    }).join("")+`</div>`;
  }
  const btnRetirada = `
  <div class="alertbox" style="background:#FFF3E0; border:1px solid #FFCC80; color:#7A4A00; display:flex; justify-content:space-between; align-items:center; gap:10px;">
    <div>🚨 <b>Retirou item vencido que não estava acompanhado?</b><br><span style="font-size:12px;">Registre aqui com fotos — vira comprovante e lançamento ao fornecedor.</span></div>
    <button class="btn-sm" style="margin:0; padding:8px 12px; background:#E65100; color:#fff; border:none; border-radius:8px; font-size:12px; flex:0 0 auto;" onclick="go('retirada')">Registrar retirada</button>
  </div>`;
  return btnRetirada + `<h3 class="sec">Calendário ${nivel(sess.papel)>=3?"— todas as lojas":"— "+LOJAS[sess.loja]}</h3>`+html;
}

async function salvarRetirada(){
  const ean = document.getElementById("ean").value.trim();
  const val = document.getElementById("rval").value;
  const qtd = parseFloat(document.getElementById("rqtd").value);
  const motivo = document.getElementById("rmot").value;
  const files = [...(document.getElementById("rfotos").files||[])];
  const loja = sess.papel==="gestor" ? lojaRetirada : sess.loja;
  if(!loja) return alert("Escolha a loja onde o item foi retirado.");
  if(!ean) return alert("Informe o EAN do produto.");
  if(!val) return alert("Informe a validade encontrada na embalagem.");
  if(!(qtd>0)) return alert("Informe a quantidade retirada.");
  if(!files.length) return alert("Anexe pelo menos 1 foto como comprovante.");
  if(files.length>3) return alert("No máximo 3 fotos.");
  loading(true);
  try{
    // garante o produto cadastrado (mesma regra da contagem: via catálogo do VR)
    if(!prodAtual){
      if(!catAtual){
        loading(false);
        return alert("Produto não está no catálogo da rede. Cadastre-o no VR Controller e aguarde a sincronização.");
      }
      const novo = {ean, id_produto:catAtual.id_produto, descricao:catAtual.descricao};
      const {data:pr,error:ep} = await sb.from("produtos").upsert(novo,{onConflict:"ean"}).select().single();
      if(ep) throw ep;
      prodAtual = pr;
    }
    const pl = ploja(ean, loja) || (await sb.from("produtos_loja").select("*").eq("ean",ean).eq("loja",loja).maybeSingle()).data || {};
    const custo = Number(pl.ultimo_custo)||0;
    const valor = qtd*custo;
    if(!confirm(`Registrar retirada sem acompanhamento?\n\n${prodAtual.descricao}\n${LOJAS[loja]} · ${qtd} un · validade ${fmtData(val)}\nMotivo: ${motivo}\nFotos: ${files.length}\n${custo>0?`Lançamento ao fornecedor: ${brl(valor)}`:"Custo indisponível — sem lançamento ao fornecedor"}`)) { loading(false); return; }
    // lote retroativo (contagem era zero — item não estava acompanhado)
    const {data:lote, error:eL} = await sb.from("lotes").insert({
      ean, loja, validade:val, qtd_inicial:qtd, qtd_restante:qtd,
      preco_atual: pl.preco_venda?Number(pl.preco_venda):null,
      criado_por:sess.id, criado_por_nome:sess.nome, resolvido:true
    }).select().single();
    if(eL) throw eL;
    const fotos = [];
    for(let i=0;i<files.length;i++){
      const blob = await comprimirImagem(files[i]);
      const path = `${lote.id}/${Date.now()}_${i}.jpg`;
      const {error:eU} = await sb.storage.from("descartes").upload(path, blob, {contentType:"image/jpeg", upsert:true});
      if(eU) throw new Error("Upload da foto "+(i+1)+": "+eU.message);
      fotos.push(sb.storage.from("descartes").getPublicUrl(path).data.publicUrl);
    }
    const {error:eD} = await sb.from("descartes").upsert({
      lote_id: lote.id, qtd_contada: 0, qtd_validada: qtd,
      fotos, status: "validado",
      validado_por: sess.nome + " — retirada sem acompanhamento (" + motivo + ")",
      validado_em: new Date().toISOString()
    }, {onConflict:"lote_id"});
    if(eD) throw eD;
    if(custo>0){
      const {error:eR} = await sb.from("ressarcimento_diario").upsert({
        lote_id: lote.id, ean, loja,
        id_fornecedor: pl.id_fornecedor, nome_fornecedor: pl.nome_fornecedor,
        data: String(val).slice(0,10),
        qtd_vendida: qtd, preco_normal: custo, preco_vigente: 0,
        valor: Math.round(valor*100)/100
      }, {onConflict:"lote_id,data"});
      if(eR) throw eR;
    }

    document.getElementById("ean").value=""; document.getElementById("rval").value="";
    document.getElementById("rqtd").value=""; document.getElementById("rfotos").value="";
    document.getElementById("pinfo").innerHTML="";
    prodAtual=null; catAtual=null;
    go('calendario');
  }catch(e){ erroDB(e); }
  loading(false);
}

/* ================= GESTOR ================= */
let secaoFiltro = null;  // null = todas
function secaoDo(l){ return (l.produtos && l.produtos.secao) || null; }

let ordenar = "prioridade";  // prioridade | recente | loja
let lojaFiltro = null;       // filtro de loja na visão "Por loja"
let apenasAnalisar = false;
const ORDENACOES = {
  prioridade:"Data · Quantidade",
  recente:"Recém incluídos",
  loja:"Por loja"
};
function ordenarLotes(arr){
  const cp = arr.slice();
  if(ordenar==="recente"){
    cp.sort((a,b)=> String(b.criado_em).localeCompare(String(a.criado_em)));
  } else if(ordenar==="loja"){
    cp.sort((a,b)=>{
      if(a.loja!==b.loja) return a.loja.localeCompare(b.loja);
      const da=diasAte(a.validade), db=diasAte(b.validade);
      return da!==db ? da-db : Number(b.qtd_restante)-Number(a.qtd_restante);
    });
  } else {
    cp.sort((a,b)=>{ const da=diasAte(a.validade), db=diasAte(b.validade);
      return da!==db ? da-db : Number(b.qtd_restante)-Number(a.qtd_restante); });
  }
  return cp;
}

function vGestor(){
  const todosLotes = cache.lotes.filter(l=>Number(l.qtd_restante)>0 || l.zerado);

  const secoes = Object.entries(contSec).sort((a,b)=>b[1]-a[1]);
  // aplicar filtros
  let ls = secaoFiltro
    ? todosLotes.filter(l=> (secaoDo(l)||"(sem seção)")===secaoFiltro)
    : todosLotes;
  if(ordenar==="loja" && lojaFiltro) ls = ls.filter(l=> l.loja===lojaFiltro);

async function pedirSync(){
  const senha = prompt("🔄 Sincronizar dados do VR agora?\n\nA sincronização automática continua rodando nos horários fixos (07h e 16h). Este disparo manual é para quando você acabou de cadastrar produtos e quer os dados na hora.\n\nDigite a senha de liberação:");
  if(senha===null) return;
  if(!senha.trim()) return;
  loading(true);
  try{
    const resp = await fetch("https://estciwkeihmokvlnvaum.supabase.co/functions/v1/disparar-sync", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({senha: senha.trim()})
    });
    if(resp.status===401){ alert("Senha incorreta."); loading(false); return; }
    if(!resp.ok){
      const t = await resp.text();
      throw new Error("Falha ao disparar (HTTP "+resp.status+"). "+t.slice(0,120));
    }
    alert("✅ Sincronização disparada!\n\nLeva cerca de 12-15 minutos pra concluir. Recarregue a tela depois desse tempo para ver os dados atualizados.");
  }catch(e){
    alert("Não foi possível disparar a sincronização.\n\n"+(e.message||e)+"\n\nSe persistir, os horários automáticos (07h/16h) seguem funcionando normalmente.");
  }
  loading(false);
}

function sugMarcarTodas(v){
  document.querySelectorAll(".sugchk").forEach(c=>{ c.checked = v; });
}
function sugSelecionadas(){
  return [...document.querySelectorAll(".sugchk:checked")].map(c=>({
    id: Number(c.dataset.sug), lote: c.dataset.lote, preco: Number(c.dataset.preco)
  }));
}

async function aceitarSelecionadas(){
  const sel = sugSelecionadas();
  if(!sel.length) return alert("Marque pelo menos uma sugestão.");
  const abaixo = sel.filter(s=>{ const x = sugCache.find(y=>y.s.id===s.id); return x && x.abaixoCusto; });
  let aviso = `Aplicar ${sel.length} preço(s) sugerido(s) e marcar como aceitos?`;
  if(abaixo.length) aviso += `\n\nATENÇÃO: ${abaixo.length} está(ão) abaixo do último custo.`;
  if(!confirm(aviso)) return;
  loading(true);
  let ok=0, falhas=[];
  for(const s of sel){
    try{
      const {error} = await sb.from("lotes").update({preco_atual:s.preco, pend_apoio:true,
        analisado_em:new Date().toISOString()}).eq("id", s.lote);
      if(error) throw error;
      await sb.from("precos_hist").insert({lote_id:s.lote, preco:s.preco,
        aplicado_por:sess.id, aplicado_por_nome:sess.nome+" (sug. fornecedor)"});
      await sb.from("sugestoes_fornecedor").update({status:"aceita",
        respondido_por_nome:sess.nome, respondido_em:new Date().toISOString()}).eq("id", s.id);
      ok++;
    }catch(e){ falhas.push(s.id); }
  }
  loading(false);
  alert(`${ok} sugestão(ões) aceita(s) e preço aplicado.`
        + (falhas.length? `\n${falhas.length} falhou(ram) — tente de novo.` : ""));
  render();
}

async function recusarSelecionadas(){
  const sel = sugSelecionadas();
  if(!sel.length) return alert("Marque pelo menos uma sugestão.");
  if(!confirm(`Recusar ${sel.length} sugestão(ões)? Os fornecedores verão a recusa no portal.`)) return;
  loading(true);
  let ok=0;
  for(const s of sel){
    try{
      await sb.from("sugestoes_fornecedor").update({status:"recusada",
        respondido_por_nome:sess.nome, respondido_em:new Date().toISOString()}).eq("id", s.id);
      ok++;
    }catch(e){}

  loading(false);
  alert(`${ok} sugestão(ões) recusada(s).`);
  render();
}

async function aceitarSugestao(sugId, loteId, preco){
  const l = cache.lotes.find(x=>x.id===loteId);
  // a aba de sugestões não carrega cache.lotes; usa o contexto que ela já buscou
  const daAba = (typeof sugCache!=="undefined" && sugCache.find(x=>x.s.id===sugId)) || null;
  const custo = l ? (ploja(l.ean,l.loja)||{}).ultimo_custo : (daAba ? daAba.custo : 0);
  if(custo && preco<Number(custo) && !confirm("Preço sugerido está abaixo do custo ("+brl(custo)+"). Aceitar mesmo assim?")) return;
  if(!confirm(`Aplicar ${brl(preco)} neste lote e marcar a sugestão como aceita?`)) return;
  loading(true);
  try{
    const {error} = await sb.from("lotes").update({preco_atual:preco, pend_apoio:true, analisado_em:new Date().toISOString()}).eq("id",loteId);
    if(error) throw error;
    await sb.from("precos_hist").insert({lote_id:loteId, preco, aplicado_por:sess.id, aplicado_por_nome:sess.nome+" (sug. fornecedor)"});
    await sb.from("sugestoes_fornecedor").update({status:"aceita", respondido_por_nome:sess.nome, respondido_em:new Date().toISOString()}).eq("id",sugId);
    alert("Sugestão aceita — preço aplicado e item no relatório da equipe de apoio.");

async function registrarVenda(id){
  const l=cache.lotes.find(x=>x.id===id);
  const q=parseFloat(document.getElementById("vqtd").value);
  if(!(q>0)) return alert("Quantidade inválida.");
  const real=Math.min(q, Number(l.qtd_restante));
  loading(true);
  try{
    const novo = Number(l.qtd_restante)-real;
    const {error} = await sb.from("lotes").update({qtd_restante:novo, zerado:novo<=0}).eq("id",id);
    if(error) throw error;
    const h = cache.hist[l.id]||await carregarHist(l.id);
    if(h.length){
      const ult=h[h.length-1];
      await sb.from("precos_hist").update({vendido:Number(ult.vendido)+real}).eq("id",ult.id);
    }
    if(novo<=0) alert("🎉 Lote zerado! Alerta enviado à prevenção de perdas para normalizar o preço.");
  }catch(e){ erroDB(e); }
  loading(false); render();
}


/* ================= VALIDAÇÃO DE DESCARTE (Prevenção) ================= */
function comprimirImagem(file, maxDim=1280, qualidade=0.72){
  return new Promise((res, rej)=>{
    const img = new Image();
    img.onload = ()=>{
      let w=img.width, h=img.height;
      if(w>maxDim||h>maxDim){ const f=maxDim/Math.max(w,h); w=Math.round(w*f); h=Math.round(h*f); }
      const cv=document.createElement("canvas"); cv.width=w; cv.height=h;
      cv.getContext("2d").drawImage(img,0,0,w,h);
      cv.toBlob(b=>b?res(b):rej(new Error("falha ao comprimir")), "image/jpeg", qualidade);
      URL.revokeObjectURL(img.src);
    };
    img.onerror = ()=>rej(new Error("imagem inválida"));
    img.src = URL.createObjectURL(file);
  });
}

async function confirmarDescarte(loteId){
  const l = cache.lotes.find(x=>x.id===loteId);
  if(!l) return;
  const qtd = parseFloat(document.getElementById("dq_"+loteId).value);
  if(isNaN(qtd) || qtd<0) return alert("Quantidade inválida.");
  const files = [...(document.getElementById("df_"+loteId).files||[])];
  if(files.length>3) return alert("No máximo 3 fotos por lote.");
  const pl = ploja(l.ean,l.loja)||{};
  const custo = Number(pl.ultimo_custo)||0;
  const valor = qtd*custo;
  if(!confirm(`Confirmar descarte?\n\n${(l.produtos&&l.produtos.descricao)||l.ean}\nContado: ${Number(l.qtd_restante)} un · Validado: ${qtd} un\nFotos: ${files.length}\n${qtd>0&&custo>0?`Lançamento ao fornecedor: ${brl(valor)}`:"Sem lançamento (qtd zero ou custo indisponível)"}`)) return;
  loading(true);
  try{
    const fotos = [];
    for(let i=0;i<files.length;i++){
      const blob = await comprimirImagem(files[i]);
      const path = `${loteId}/${Date.now()}_${i}.jpg`;
      const {error:eU} = await sb.storage.from("descartes").upload(path, blob, {contentType:"image/jpeg", upsert:true});
      if(eU) throw new Error("Upload da foto "+(i+1)+": "+eU.message);
      fotos.push(sb.storage.from("descartes").getPublicUrl(path).data.publicUrl);
    }
    const {error:eD} = await sb.from("descartes").upsert({
      lote_id: loteId, qtd_contada: Number(l.qtd_restante), qtd_validada: qtd,
      fotos, status: "validado", validado_por: sess.nome,
      validado_em: new Date().toISOString()
    }, {onConflict:"lote_id"});
    if(eD) throw eD;
    if(qtd>0 && custo>0){
      const {error:eR} = await sb.from("ressarcimento_diario").upsert({
        lote_id: loteId, ean: l.ean, loja: l.loja,
        id_fornecedor: pl.id_fornecedor, nome_fornecedor: pl.nome_fornecedor,
        data: String(l.validade).slice(0,10),
        qtd_vendida: qtd, preco_normal: custo, preco_vigente: 0,
        valor: Math.round(valor*100)/100
      }, {onConflict:"lote_id,data"});
      if(eR) throw eR;
    }
    const {error:eL} = await sb.from("lotes").update({resolvido:true}).eq("id",loteId);
    if(eL) throw eL;
    alert("Descarte validado"+(qtd>0&&custo>0?` — ${brl(valor)} lançado ao fornecedor`:"")+". Comprovante arquivado.");
  }catch(e){
    if(String(e.message||"").includes("descartes")) alert("O quadro de descartes ainda não foi ativado no banco. Rode o SQL de setup.");
    else erroDB(e);
  }
  loading(false); render();
}

/* ============ ÍNDICE DE PREVENÇÃO DE PERDAS (Gestor) ============ */
let perdasMes = null;
function setPerdasMes(m){ perdasMes = m; render(); }
async function vPerdas(){
  const view = document.getElementById("view");
  const mes = perdasMes || mesAtual();
  const ini = mes+"-01", fim = mesPrev(mes,-1)+"-01";
  try{
    // fontes
    const {data:ress, error:e1} = await sb.from("ressarcimento_diario")
      .select("lote_id,ean,loja,id_fornecedor,nome_fornecedor,valor,preco_vigente,qtd_vendida,data")
      .gte("data",ini).lt("data",fim);
    if(e1) throw e1;
    const {data:descs} = await sb.from("descartes").select("lote_id,qtd_contada,qtd_validada").eq("status","validado");
    const descPorLote = {}; (descs||[]).forEach(d=>{ descPorLote[d.lote_id]=d; });
    const eans = [...new Set((ress||[]).map(r=>r.ean))];
    const secaoPorEan = {};
    for(let i=0;i<eans.length;i+=200){
      const {data:ps} = await sb.from("produtos").select("ean,secao").in("ean",eans.slice(i,i+200));
      (ps||[]).forEach(p=>{ secaoPorEan[p.ean]=p.secao||"(sem seção)"; });
    }
    let compras = [], balancos = [], semCompras = false, semBalancos = false;
    try{ const r = await sb.from("compras_mes").select("*").eq("mes",mes); if(r.error) throw r.error; compras = r.data||[]; }catch(e){ semCompras = true; }
    try{ const r = await sb.from("balancos").select("*").eq("mes",mes); if(r.error) throw r.error; balancos = r.data||[]; }catch(e){ semBalancos = true; }

    // agregações
    const porLoja = {}, porForn = {}, porSec = {};
    const L = lj => porLoja[lj] || (porLoja[lj]={rebaixa:0, vencAcomp:0, vencSem:0, balanco:0, compras:0});
    const chave = n => String(n||"(sem nome)").trim().toUpperCase().replace(/\s+/g," ");
    const F = (id,nome) => { const k = id?("id"+id):chave(nome); return porForn[k] || (porForn[k]={nome:nome||"(sem nome)", rebaixa:0, venc:0, compras:0}); };
    const S = s => porSec[s||"(sem seção)"] || (porSec[s||"(sem seção)"]={rebaixa:0, venc:0, compras:0});
    (ress||[]).forEach(r=>{
      const val = Number(r.valor)||0;
      const sec = secaoPorEan[r.ean]||"(sem seção)";
      if(Number(r.preco_vigente)>0){
        L(r.loja).rebaixa += val; F(r.id_fornecedor,r.nome_fornecedor).rebaixa += val; S(sec).rebaixa += val;
      } else {
        const d = descPorLote[r.lote_id];
        if(d && Number(d.qtd_contada)===0) L(r.loja).vencSem += val;
        else L(r.loja).vencAcomp += val;
        F(r.id_fornecedor,r.nome_fornecedor).venc += val; S(sec).venc += val;
      }
    });
    (compras||[]).forEach(c=>{
      L(c.loja).compras += Number(c.valor)||0;
      F(c.id_fornecedor,c.nome_fornecedor).compras += Number(c.valor)||0;
      S(c.secao).compras += Number(c.valor)||0;

    (balancos||[]).forEach(b=>{ L(b.loja).balanco = Number(b.valor)||0; });

          <button class="btn-sm" style="margin:0; padding:4px 8px; font-size:11px;" onclick="salvarBalanco('${lj}','${mes}')">💾</button>

    </div>
    <div class="ress"><div><div class="l">Perda total da rede em ${mesLabel(mes)} ${totG.compras?("· "+pct(totalG,totG.compras)+" das compras"):""}</div><div class="v">${brl(totalG)}</div></div><div style="font-size:26px;">📉</div></div>
    ${semCompras?'<div class="alertbox" style="background:#FFF3CD; color:#8A6D0B; border:1px solid #FFE082;">⚠️ Tabela <b>compras_mes</b> ainda não existe no banco — rode o SQL de setup e aguarde o próximo sync para ver os percentuais sobre compras.</div>':""}

async function salvarBalanco(lj, mes){
  const valor = parseFloat(document.getElementById("bal_"+lj).value)||0;
  loading(true);
  try{
    const {error} = await sb.from("balancos").upsert({
      loja: lj, mes: mes, valor: valor, criado_por: sess.nome, criado_em: new Date().toISOString()
    }, {onConflict:"loja,mes"});
    if(error) throw error;
    alert(`Balanço de ${LOJAS[lj]} em ${mesLabel(mes)}: ${brl(valor)} salvo.`);
  }catch(e){
    if(String(e.message||"").includes("balancos")) alert("A tabela de balanços ainda não foi criada no banco. Rode o SQL de setup.");
    else erroDB(e);
  }
  loading(false); render();
}

async function criarUsuarioFornecedor(){
  const ids = [...document.querySelectorAll(".fuFornCk:checked")].map(x=>parseInt(x.value));
  const idf = ids[0];
  const nome = document.getElementById("fuNome").value.trim();
  const pin = document.getElementById("fuPin").value.trim();
  if(!ids.length) return alert("Marque pelo menos um fornecedor.");
  if(!nome) return alert("Informe o nome de quem vai acessar.");
  if(!/^\d{6}$/.test(pin)) return alert("PIN precisa ter exatamente 6 dígitos.");
  if(!confirm(`Criar acesso de fornecedor?\n\nUsuário: ${nome}\nCNPJs vinculados: ${ids.length}\nEle verá apenas os produtos e a conta desses fornecedores.`)) return;
  loading(true);
  try{
    const {error} = await sb.from("usuarios").insert({
      nome, papel:"fornecedor", loja:"L01", id_fornecedor:idf,
      ids_fornecedor: ids.join(","), ativo: true,
      pin_hash: await sha256(pin)
    });
    if(error) throw error;
    alert("Acesso criado. Passe o nome e o PIN ao fornecedor — ele entra pela mesma tela de login.");
    document.getElementById("fuNome").value=""; document.getElementById("fuPin").value="";
  }catch(e){
    if(String(e.message||"").includes("id_fornecedor")) alert("O banco ainda não tem a coluna id_fornecedor. Rode o SQL de setup que o suporte passou.");
    else erroDB(e);
  }
  loading(false); render();
}

  const lotes = fornLojaSel ? lotesTodos.filter(l=>l.loja===fornLojaSel) : lotesTodos;
  // Sugestões pendentes/respondidas deste fornecedor (últimos 30 dias)

    const corte = new Date(Date.now()-30*24*3600*1000).toISOString();
    const {data:sugs} = await sb.from("sugestoes_fornecedor").select("*").in("id_fornecedor",idsF).gte("criado_em",corte).order("criado_em",{ascending:false});

  const ger = (ress||[]).reduce((a,x)=>a+Number(x.valor||0),0);

  const rebaixa = (ress||[]).filter(x=>Number(x.preco_vigente)>0).reduce((a,x)=>a+Number(x.valor||0),0);

  const grupos = {};

    const tipo = Number(r.preco_vigente)===0 ? "Vencimento" : "Rebaixa";

  return `

      ${lojasComItem.map(lj=>`<button class="chip ${fornLojaSel===lj?'chip-on':''}" onclick="setFornLoja('${lj}')">${LOJAS[lj]||lj} <span class="chip-n">${lotesTodos.filter(l=>l.loja===lj).length}</span></button>`).join("")}

  <div class="kpis">

  ${lotes.length? lotes.map(l=>{
    const d=diasAte(l.validade), b=bucket(d), pn=precoNormal(l);
    const promo = l.preco_atual && pn && Number(l.preco_atual)<pn;

    let sugHtml = "";

    return `<div class="item" style="flex-wrap:wrap;">
      <div style="flex:1; min-width:200px;"><div class="t">${badgeLoja(l.loja)}${l.produtos?l.produtos.descricao:l.ean}</div>
      <div class="s">${LOJAS[l.loja]} · ${Number(l.qtd_restante)} un · vence ${fmtData(l.validade)}${promo?` · de ${brl(pn)} por <b>${brl(l.preco_atual)}</b>`:` · preço ${brl(l.preco_atual||pn||0)}`}</div>
      ${sugHtml}</div>

        ${podeSugerir?`<button class="btn-s btn-sm" style="flex:0 0 auto; margin:0; padding:8px 12px;" onclick="sugerirPreco('${l.id}','${nomeForn.replace(/'/g,"")}',${idsF[0]})">💡 Sugerir preço</button>`:""}
        <span class="badge" style="background:${b.cor}">${d<0?"VENC.":(d===0?"HOJE":d+"d")}</span>

  </div>

    <h2>Conta — ${mesLabel(mes)}</h2>
    <p class="muted" style="margin-top:-4px;">Consolidada de todas as lojas${idsF.length>1?" e CNPJs":""}.</p>

async function sugerirPreco(loteId, nomeForn, idf){
  const l = cache.lotes.find(x=>x.id===loteId);
  const pn = precoNormal(l);
  const v = prompt(`Sugerir preço de rebaixa para:\n${(l.produtos&&l.produtos.descricao)||l.ean}\n\nPreço atual: ${brl(l.preco_atual||pn||0)}\n\nDigite o preço sugerido (ex: 4,99):`);
  if(v===null) return;
  const preco = parseFloat(String(v).replace(",","."));
  if(!(preco>0)) return alert("Valor inválido.");
  loading(true);
  try{
    const {error} = await sb.from("sugestoes_fornecedor").insert({
      lote_id: loteId, id_fornecedor: idf, nome_fornecedor: nomeForn,
      sugerido_por: sess.nome, preco: preco
    });
    if(error) throw error;
    alert(`Sugestão de ${brl(preco)} enviada ao gestor. Você acompanha o status aqui no portal.`);
  }catch(e){
    if(String(e.message||"").includes("sugestoes_fornecedor")) alert("O quadro de sugestões ainda não foi ativado no banco. O gestor precisa rodar o SQL de setup.");
    else erroDB(e);
  }
  loading(false); render();

let placasSel = new Set();
let placaFiltro = {loja:null, secao:null, estado:"todos"};
let placaTam = "A6";

function lotesPlacas(){
  let ls = cache.lotes.filter(l=>!l.zerado && Number(l.qtd_restante)>0 && diasAte(l.validade)>=0);
  if(sess.papel==="fornecedor") ls = ls.filter(l=>cache.eansForn && cache.eansForn.has(l.ean));
  const lojaFix = (sess.papel==="gestor"||sess.papel==="fornecedor") ? placaFiltro.loja : sess.loja;
  if(lojaFix) ls = ls.filter(l=>l.loja===lojaFix);
  if(placaFiltro.secao) ls = ls.filter(l=>(secaoDo(l)||"(sem seção)")===placaFiltro.secao);
  if(placaFiltro.estado==="vigente"){
    ls = ls.filter(l=>{ const pn=precoNormal(l); return l.preco_atual && pn && Number(l.preco_atual)<pn; });
  } else if(placaFiltro.estado==="alterados"){
    const corte = Date.now() - 48*3600*1000;
    ls = ls.filter(l=>{ const h=cache.hist[l.id]||[]; if(!h.length) return false;
      return new Date(h[h.length-1].criado_em).getTime() >= corte; });
  } else if(placaFiltro.estado==="sugeridos"){
    ls = ls.filter(l=>{ const h=cache.hist[l.id]||[]; if(!h.length) return false;
      return String(h[h.length-1].aplicado_por_nome||"").includes("sug. fornecedor"); });
  }
  return ls.sort((a,b)=>{ const da=diasAte(a.validade), db=diasAte(b.validade);
    return da!==db ? da-db : Number(b.qtd_restante)-Number(a.qtd_restante); });
}

function vPlacas(){
  const ls = lotesPlacas();
  const idsVisiveis = ls.map(l=>l.id);
  const nSel = idsVisiveis.filter(id=>placasSel.has(id)).length;
  const contSec = {};
  cache.lotes.filter(l=>!l.zerado && Number(l.qtd_restante)>0 && diasAte(l.validade)>=0)
    .filter(l=>sess.papel!=="fornecedor" || (cache.eansForn && cache.eansForn.has(l.ean)))
    .forEach(l=>{ const s=secaoDo(l)||"(sem seção)"; contSec[s]=(contSec[s]||0)+1; });
  const secoes = Object.keys(contSec).sort();
  const gestor = sess.papel==="gestor" || sess.papel==="fornecedor";
  return `
  <div class="card">
    <h2>🖨 Placas de data crítica</h2>
    <p class="muted">Selecione os itens e gere um PDF com a arte "Agora ou Nunca" — preço e validade em destaque. ${gestor?"":"Mostrando apenas "+LOJAS[sess.loja]+"."}</p>
    ${gestor?`<label>Loja</label>
    <select onchange="setPlacaFiltro('loja', this.value||null)">
      <option value="">Todas as lojas</option>
      ${Object.entries(LOJAS).map(([k,v])=>`<option value="${k}" ${placaFiltro.loja===k?'selected':''}>${v}</option>`).join("")}
    </select>`:""}
    <label>Seção</label>
    <select onchange="setPlacaFiltro('secao', this.value||null)">
      <option value="">Todas as seções</option>
      ${secoes.map(s=>`<option value="${s.replace(/"/g,'&quot;')}" ${placaFiltro.secao===s?'selected':''}>${s} (${contSec[s]})</option>`).join("")}
    </select>
    <label>Mostrar</label>
    <div style="display:flex; gap:6px; flex-wrap:wrap; margin-top:4px;">
      <button class="chip ${placaFiltro.estado==='todos'?'chip-on':''}" onclick="setPlacaFiltro('estado','todos')">Todos</button>
      <button class="chip ${placaFiltro.estado==='vigente'?'chip-on':''}" onclick="setPlacaFiltro('estado','vigente')">Rebaixa vigente</button>
      <button class="chip ${placaFiltro.estado==='alterados'?'chip-on':''}" onclick="setPlacaFiltro('estado','alterados')">Alterados (48h)</button>
      <button class="chip ${placaFiltro.estado==='sugeridos'?'chip-on':''}" onclick="setPlacaFiltro('estado','sugeridos')">💡 Sugeridos por fornecedor</button>
    </div>
    <label>Tamanho da placa</label>
    <div style="display:flex; gap:6px; margin-top:4px; flex-wrap:wrap;">
      <button class="chip ${placaTam==='A6'?'chip-on':''}" onclick="setPlacaTam('A6')">A6 · 4 por folha</button>
      <button class="chip ${placaTam==='A5'?'chip-on':''}" onclick="setPlacaTam('A5')">A5 · 2 por folha</button>
      <button class="chip ${placaTam==='A4'?'chip-on':''}" onclick="setPlacaTam('A4')">A4 · 1 por folha</button>
    </div>
    <button class="btn-p" onclick="gerarPlacas()">🖨 Gerar PDF (<span id="nSel">${nSel}</span> placa${nSel===1?'':'s'})</button>
  </div>
  <div class="card" style="padding:6px 16px;">
    <div class="item" style="border-bottom:2px solid var(--line);">
      <label style="display:flex; align-items:center; gap:10px; margin:0; cursor:pointer; font-weight:700; color:var(--navy);">
        <input type="checkbox" style="width:20px; height:20px; margin:0;" ${nSel===idsVisiveis.length && idsVisiveis.length>0 ?'checked':''} onchange="togglePlacasTodos(this.checked)">
        Marcar todos os visíveis (${idsVisiveis.length})
      </label>
    </div>
    ${ls.map(l=>{
      const d=diasAte(l.validade), b=bucket(d), pn=precoNormal(l);
      const promo = l.preco_atual && pn && Number(l.preco_atual)<pn;
      return `<div class="item">
        <label style="display:flex; align-items:center; gap:10px; margin:0; flex:1; cursor:pointer;">
          <input type="checkbox" style="width:20px; height:20px; margin:0; flex:0 0 auto;" ${placasSel.has(l.id)?'checked':''} onchange="togglePlaca('${l.id}')">
          <div style="flex:1;"><div class="t">${badgeLoja(l.loja)}${l.produtos?l.produtos.descricao:l.ean}</div>
          <div class="s">${promo?`de ${brl(pn)} por <b>${brl(l.preco_atual)}</b>`:`preço ${brl(l.preco_atual||pn||0)}`} · vence ${fmtData(l.validade)}</div></div>
        </label>
        <span class="badge" style="background:${b.cor}">${d<0?"VENC.":(d===0?"HOJE":d+"d")}</span>
      </div>`;
    }).join("") || '<p class="muted">Nenhum item com esses filtros.</p>'}
  </div>`;
}
function setPlacaFiltro(k,v){ placaFiltro[k]=v; render(); }
function setPlacaTam(t){ placaTam=t; render(); }
function togglePlaca(id){
  if(placasSel.has(id)) placasSel.delete(id); else placasSel.add(id);
  const ids = lotesPlacas().map(l=>l.id);
  const n = ids.filter(x=>placasSel.has(x)).length;
  const el = document.getElementById("nSel"); if(el) el.textContent = n;
}
function togglePlacasTodos(marcar){
  lotesPlacas().forEach(l=>{ if(marcar) placasSel.add(l.id); else placasSel.delete(l.id); });
  render();
}

function desenhaPlaca(doc, x, y, w, h, l){
  doc.addImage(ARTE_PLACA, "JPEG", x, y, w, h);
  const cx = x + w/2, esc = w/210;
  const pn = precoNormal(l);
  const promo = l.preco_atual && pn && Number(l.preco_atual)<pn;
  const precoFinal = Number(l.preco_atual || pn || 0);
  const nome = ((l.produtos&&l.produtos.descricao)||l.ean).toUpperCase();
  // Nome do produto
  doc.setTextColor(31,56,100);
  doc.setFont("helvetica","bold");
  let fs = 40*esc, linhas;
  do{ doc.setFontSize(fs); linhas = doc.splitTextToSize(nome, w*0.80); fs -= 2; } while(linhas.length>3 && fs>14*esc);
  const lh = (fs+2)*0.42*esc + fs*0.11;
  let ny = y + h*0.385;
  linhas.forEach((ln,i)=>{ doc.text(ln, cx, ny + i*(fs*0.42), {align:"center"}); });
  // Preços
  if(promo){
    const deTxt = "DE " + brl(pn);
    doc.setFontSize(26*esc); doc.setTextColor(120,120,120);
    const dy = y + h*0.60;
    doc.text(deTxt, cx, dy, {align:"center"});
    const tw = doc.getTextWidth(deTxt);
    doc.setDrawColor(198,40,40); doc.setLineWidth(1.2*esc);
    doc.line(cx-tw/2-2*esc, dy-2.5*esc, cx+tw/2+2*esc, dy-2.5*esc);
    doc.setFontSize(20*esc); doc.setTextColor(31,56,100);
    doc.text("POR", cx, y + h*0.655, {align:"center"});
    doc.setFontSize(80*esc); doc.setTextColor(198,40,40);
    doc.text(brl(precoFinal), cx, y + h*0.755, {align:"center"});
  } else {
    doc.setFontSize(24*esc); doc.setTextColor(31,56,100);
    doc.text("APENAS", cx, y + h*0.615, {align:"center"});
    doc.setFontSize(80*esc); doc.setTextColor(198,40,40);
    doc.text(brl(precoFinal), cx, y + h*0.735, {align:"center"});
  }
  // Box de validade
  const bw = w*0.68, bh = h*0.062, bx = cx-bw/2, by = y + h*0.82;
  doc.setFillColor(198,40,40);
  doc.roundedRect(bx, by, bw, bh, 3*esc, 3*esc, "F");
  doc.setFontSize(22*esc); doc.setTextColor(255,255,255);
  doc.text("VÁLIDO ATÉ " + fmtData(l.validade), cx, by + bh*0.68, {align:"center"});
  // rodapé técnico
  doc.setFontSize(7*esc); doc.setTextColor(150,150,150);
  doc.text(`${l.ean} · ${LOJAS[l.loja]||l.loja}`, cx, y + h*0.945, {align:"center"});
}

async function gerarPlacas(){
  const itens = cache.lotes.filter(l=>placasSel.has(l.id));
  if(!itens.length) return alert("Selecione pelo menos um item na lista.");
  if(!window.jspdf) return alert("Biblioteca de PDF ainda carregando — tente de novo em 2 segundos.");
  loading(true);
  try{
    const { jsPDF } = window.jspdf;
    let doc;
    if(placaTam==="A4"){
      doc = new jsPDF({orientation:"portrait", unit:"mm", format:"a4"});
      itens.forEach((l,i)=>{ if(i>0) doc.addPage("a4","portrait"); desenhaPlaca(doc, 0, 0, 210, 297, l); });
    } else if(placaTam==="A5"){
      doc = new jsPDF({orientation:"landscape", unit:"mm", format:"a4"});
      itens.forEach((l,i)=>{
        if(i>0 && i%2===0) doc.addPage("a4","landscape");
        desenhaPlaca(doc, (i%2)*148.5, 0, 148.5, 210, l);
        if(i%2===0){ doc.setDrawColor(180,180,180); doc.setLineDashPattern([3,3],0); doc.setLineWidth(0.3);
          doc.line(148.5, 0, 148.5, 210); doc.setLineDashPattern([],0); }
      });
    } else {
      // A6: 4 por folha A4 retrato (2 colunas × 2 linhas)
      doc = new jsPDF({orientation:"portrait", unit:"mm", format:"a4"});
      itens.forEach((l,i)=>{
        const pos = i % 4;
        if(i>0 && pos===0) doc.addPage("a4","portrait");
        const x = (pos%2)*105, y = Math.floor(pos/2)*148.5;
        desenhaPlaca(doc, x, y, 105, 148.5, l);
        if(pos===0){ doc.setDrawColor(180,180,180); doc.setLineDashPattern([3,3],0); doc.setLineWidth(0.3);
          doc.line(105, 0, 105, 297); doc.line(0, 148.5, 210, 148.5); doc.setLineDashPattern([],0); }
      });
    }
    doc.save(`placas_datacritica_${hoje()}.pdf`);
  }catch(e){ alert("Erro ao gerar PDF: " + (e.message||e)); }
  loading(false);
}

/* ================= FORNECEDORES ================= */
function mesAtual(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"); }
function mesLabel(m){ const [y,mm]=m.split("-"); return ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"][parseInt(mm)-1]+"/"+y; }
function mesPrev(m,n=1){ const [y,mm]=m.split("-").map(Number); const d=new Date(y,mm-1-n,1); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"); }

async function vFornec(){
  const params = route.param || {};
  const mes = params.mes || mesAtual();
  const ini = mes+"-01", fim = mesPrev(mes,-1)+"-01";
  const {data:ress,error} = await sb.from("ressarcimento_diario")
    .select("id_fornecedor,nome_fornecedor,valor,qtd_vendida")
    .gte("data",ini).lt("data",fim);
  if(error){ document.getElementById("view").innerHTML=`<div class="alertbox a-red">${error.message}</div>`; return; }
  const {data:pags} = await sb.from("pagamentos_fornecedor").select("id_fornecedor,valor").eq("mes_referencia",mes);

  const agg = {};  // razão social normalizada -> {nome, ids, gerado, unidades, pago}
  const chave = n => String(n||"(sem nome)").trim().toUpperCase().replace(/\s+/g," ");
  ress.forEach(r=>{
    if(!r.id_fornecedor) return;
    const k = chave(r.nome_fornecedor);
    const a = agg[k] || (agg[k]={nome:r.nome_fornecedor||"(sem nome)", ids:new Set(), gerado:0, unidades:0, pago:0});
    a.ids.add(r.id_fornecedor);
    a.gerado += Number(r.valor)||0; a.unidades += Number(r.qtd_vendida)||0;
  });
  (pags||[]).forEach(p=>{
    const k = chave(p.nome_fornecedor);
    const a = agg[k] || (agg[k]={nome:p.nome_fornecedor||"(sem nome)", ids:new Set(), gerado:0, unidades:0, pago:0});
    if(p.id_fornecedor) a.ids.add(p.id_fornecedor);
    a.pago += Number(p.valor)||0;
  });

  const lista = Object.values(agg).map(a=>({...a, idsStr:[...a.ids].join(","), saldo:a.gerado-a.pago}))
    .sort((a,b)=>b.saldo-a.saldo);
  const totGer = lista.reduce((a,x)=>a+x.gerado,0);
  const totPag = lista.reduce((a,x)=>a+x.pago,0);
  const anterior = mesPrev(mes), proximo = mesPrev(mes,-1);
  const eAtual = (mes===mesAtual());

  document.getElementById("view").innerHTML = `
  <div class="ress"><div><div class="l">Saldo devedor · ${mesLabel(mes)}</div><div class="v">${brl(totGer-totPag)}</div></div><div style="font-size:26px;">🧾</div></div>
  <div class="kpis">
    <div class="kpi"><div class="v">${brl(totGer)}</div><div class="l">Gerado no mês</div></div>
    <div class="kpi"><div class="v">${brl(totPag)}</div><div class="l">Pago no mês</div></div>
    <div class="kpi"><div class="v">${lista.length}</div><div class="l">Fornecedores</div></div>
  </div>
  <div class="row" style="margin-bottom:12px;">
    <button class="btn-s btn-sm" style="flex:1; margin:0; padding:10px;" onclick="go('fornec',{mes:'${anterior}'})">‹ ${mesLabel(anterior)}</button>
    ${eAtual?'<div style="flex:1; text-align:center; padding:10px; font-weight:600; color:var(--navy);">Mês atual</div>'
      :`<button class="btn-s btn-sm" style="flex:1; margin:0; padding:10px;" onclick="go('fornec',{mes:'${mesAtual()}'})">Voltar ao atual</button>`}
    ${eAtual?'<div style="flex:1;"></div>':`<button class="btn-s btn-sm" style="flex:1; margin:0; padding:10px;" onclick="go('fornec',{mes:'${proximo}'})">${mesLabel(proximo)} ›</button>`}
  </div>
  <h3 class="sec">Fornecedores — maior saldo devedor primeiro</h3>
  <div class="card" style="padding:6px 16px;">
  ${lista.length? lista.map(f=>{
    const status = f.saldo<=0.01 ? '<span class="badge" style="background:var(--ok)">QUITADO</span>'
                   : (f.pago>0 ? `<span class="badge" style="background:#F57F17">PARCIAL</span>`
                   : `<span class="badge" style="background:var(--danger)">DEVEDOR</span>`);
    return `<div class="item" onclick="go('fornecdet',{ids:'${f.idsStr}',mes:'${mes}'})" style="cursor:pointer;">
      <div style="flex:1;"><div class="t">${f.nome}</div>
      <div class="s">Gerado ${brl(f.gerado)} · Pago ${brl(f.pago)} · ${Math.round(f.unidades)} un${f.ids.size>1?` · ${f.ids.size} CNPJs`:''}</div></div>
      <div style="text-align:right;"><div style="font-weight:800; color:${f.saldo>0.01?'var(--danger)':'var(--ok)'}">${brl(f.saldo)}</div>${status}</div>
    </div>`;
  }).join("") : '<p class="muted">Nenhum ressarcimento neste mês.</p>'}
  </div>`;
}

/* ---- PDF do acompanhamento do fornecedor (para negociação) ---- */
async function _imgData(url){
  try{
    const r = await fetch(url); if(!r.ok) return null;
    const blob = await r.blob();
    return await new Promise(res=>{ const fr=new FileReader(); fr.onload=()=>res(fr.result); fr.onerror=()=>res(null); fr.readAsDataURL(blob); });
  }catch(e){ return null; }
}

    const ressPorLote = {}; (ress||[]).forEach(r=>{ if(r.lote_id && !ressPorLote[r.lote_id]) ressPorLote[r.lote_id]=r; });

      (prods||[]).forEach(p=>{ descrMap[p.ean]=p.descricao; });
    }
    const grupos = {};
    (ress||[]).forEach(r=>{
      const k = r.ean+"|"+r.loja;
      const g = grupos[k] || (grupos[k]={ean:r.ean, loja:r.loja, descricao:descrMap[r.ean]||r.ean, unidades:0, valor:0, tipo:(Number(r.preco_vigente)>0?"Rebaixa":"Descarte")});

    const W = 210, ML = 14, MR = 196; let y = 0;
