    doc.setDrawColor(200); doc.line(ML, y, MR, y); y += 5;
    doc.setFont("helvetica","bold"); doc.setFontSize(10); doc.setTextColor(...NAVY);
    doc.text("TOTAL", ML, y); doc.text(brl(totGer), 196, y, {align:"right"}); y += 8;
    // recebimentos
    if(pags && pags.length){
      nl();
      doc.setFont("helvetica","bold"); doc.setFontSize(11); doc.text("Recebimentos no mês", ML, y); y += 6;
      doc.setFont("helvetica","normal"); doc.setFontSize(8.5); doc.setTextColor(40,40,40);
      pags.forEach(p=>{
        nl();
        doc.text(fmtData(p.criado_em) + " · " + (p.descricao||"") + " · aval: " + (p.aval_por_nome||"?"), ML, y);
        doc.setFont("helvetica","bold"); doc.text(brl(p.valor), 196, y, {align:"right"}); doc.setFont("helvetica","normal");
        y += 5;
      });
      y += 3;
    }
    // comprovantes de descarte com fotos
    if(descartesV.length){
      nl();
      doc.setFont("helvetica","bold"); doc.setFontSize(11); doc.setTextColor(...NAVY);
      doc.text("Comprovantes de descarte", ML, y); y += 6;
      for(const d of descartesV){
        if(y > 240){ doc.addPage(); y = 16; }
        const r = ressPorLote[d.lote_id]||{};
        doc.setFont("helvetica","bold"); doc.setFontSize(9); doc.setTextColor(40,40,40);
        doc.text(doc.splitTextToSize((descrMap[r.ean]||r.ean||"Produto") + " — " + (LOJAS[r.loja]||r.loja||""), 175)[0], ML, y); y += 4.5;
        doc.setFont("helvetica","normal"); doc.setFontSize(8); doc.setTextColor(...MUT);
        doc.text("Venceu " + (r.data?fmtData(r.data):"") + " · " + Number(d.qtd_validada) + " un descartadas (contagem: " + Number(d.qtd_contada) + ") · " + (d.validado_por||""), ML, y); y += 4;
        const fotos = (Array.isArray(d.fotos)?d.fotos:[]).slice(0,3);
        if(fotos.length){
          let x = ML;
          for(const u of fotos){
            const img = await _imgData(u);
            if(img){ try{ doc.addImage(img, "JPEG", x, y, 26, 26); x += 30; }catch(e){} }
          }
          y += 30;
        } else y += 2;
      }
    }
    // rodapé com numeração
    const total = doc.getNumberOfPages();
    for(let p=1;p<=total;p++){
      doc.setPage(p);
      doc.setFont("helvetica","normal"); doc.setFontSize(7.5); doc.setTextColor(...MUT);
      doc.text("Rende Mais · Data Crítica · " + nome + " · " + mesLabel(mes) + " — página " + p + " de " + total, W/2, 292, {align:"center"});
    }
    const nomeArq = "fornecedor_" + String(nome).trim().replace(/[^A-Za-z0-9]+/g,"_").slice(0,40) + "_" + mes + ".pdf";
    doc.save(nomeArq);
  }catch(e){ alert("Erro ao gerar o PDF: " + (e.message||e)); }
  loading(false);
}

async function registrarPagamento(idFornec, nomeFornec, mes){
  const v = parseFloat(document.getElementById("pagValor").value);
  const d = document.getElementById("pagDesc").value.trim();
  if(!(v>0)) return alert("Informe um valor válido.");
  if(!confirm(`Confirmar recebimento de ${brl(v)} do fornecedor ${nomeFornec} referente a ${mesLabel(mes)}?`)) return;
  loading(true);
  try{
    const {error} = await sb.from("pagamentos_fornecedor").insert({
      id_fornecedor:idFornec, nome_fornecedor:nomeFornec,
      mes_referencia:mes, valor:v, descricao:d,
      aval_por:sess.id, aval_por_nome:sess.nome
    });
    if(error) throw error;
    alert("Recebimento registrado.");
  }catch(e){ erroDB(e); }
  loading(false); render();
}
async function excluirPagamento(id){
  if(!confirm("Excluir este registro de recebimento? O histórico do lançamento fica no log mas o valor deixa de contar.")) return;
  loading(true);
  try{
    const {error} = await sb.from("pagamentos_fornecedor").delete().eq("id",id);
    if(error) throw error;
  }catch(e){ erroDB(e); }
  loading(false); render();
}

/* ================= RELATÓRIO ================= */
function vRelatorio(){
  const itens=cache.lotes.filter(l=>l.pend_apoio && !l.resolvido);
  const linhas=itens.map(l=>{
    const pn=precoNormal(l);
    return `${LOJAS[l.loja]} | ${l.ean} | ${l.produtos?l.produtos.descricao:""} | de ${brl(pn)} por ${brl(l.preco_atual)} | validade ${fmtData(l.validade)} | ${Number(l.qtd_restante)} un`;
  });
  const ress = cache.lotes.reduce((a,l)=>a+ressarcLote(l),0);
  const txt = `RENDE MAIS — MUDANÇA DE PREÇOS (DATA CRÍTICA)\nGerado em ${fmtData(hoje())} por ${sess.nome}\n\n`+
    (linhas.length? linhas.join("\n") : "Nenhuma alteração de preço pendente.")+
    `\n\nRessarcimento acumulado a demandar dos fornecedores: ${brl(ress)}`;
  return `<div class="card">
    <h2>Relatório para a equipe de apoio</h2>
    <p class="muted">${itens.length} alteração(ões) de preço pendente(s) de troca de etiqueta.</p>
    <pre id="reltxt">${txt}</pre>
    <button class="btn-p" onclick="copiarRel()">Copiar relatório</button>
    ${itens.length?`<button class="btn-s" onclick="marcarEnviado()">Marcar como enviado</button>`:""}
  </div>`;
}
function copiarRel(){
  const t=document.getElementById("reltxt").innerText;
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(()=>alert("Copiado! Cole no WhatsApp/e-mail da equipe."),()=>alert("Selecione e copie manualmente."));
  } else alert("Selecione o texto e copie manualmente.");
}
async function marcarEnviado(){
  loading(true);
  try{
    const ids = cache.lotes.filter(l=>l.pend_apoio).map(l=>l.id);
    const {error} = await sb.from("lotes").update({pend_apoio:false}).in("id",ids);
    if(error) throw error;
    alert("Relatório marcado como enviado.");
  }catch(e){ erroDB(e); }
  loading(false); goBack();
}

/* ================= CADASTRO ================= */
async function vCadastro(){
  const {data:prods} = await sb.from("produtos").select("*").order("descricao").limit(500);
  const {data:plF} = await sb.from("produtos_loja").select("id_fornecedor,nome_fornecedor").not("id_fornecedor","is",null);
  const fmap = {};
  (plF||[]).forEach(p=>{ if(p.id_fornecedor && !fmap[p.id_fornecedor]) fmap[p.id_fornecedor]=p.nome_fornecedor||("Fornecedor "+p.id_fornecedor); });
  const forns = Object.entries(fmap).map(([id,nome])=>({id:parseInt(id),nome})).sort((a,b)=>a.nome.localeCompare(b.nome));
  const {data:allUsers} = await sb.from("usuarios").select("*").order("ativo",{ascending:false}).order("nome");
  return `<div class="card">
    <h2>Como o acompanhamento funciona</h2>
    <p class="muted" style="line-height:1.5;">Todo produto cadastrado no VR Controller (com EAN) já está disponível no app. Basta o operador escanear na aba <b>📷 Contagem</b> — o app reconhece o item pelo catálogo e cria o acompanhamento sozinho.<br><br>Preço, custo, estoque e vendas chegam pela sincronização diária às 5h. Quando um lote zera a contagem ou vence, o app volta a usar o estoque do VR para aquele item.</p>
  </div>
  <div class="card">
    <h2>Acesso de fornecedor</h2>
    <p class="muted">Crie um login para o fornecedor acompanhar as validades dos produtos dele. Ele vê apenas os próprios itens: datas, quantidades, preços e a conta do mês (transparência total).</p>
    <label>Fornecedores — marque um ou mais (ex: os dois CNPJs da mesma empresa)</label>
    <div style="max-height:220px; overflow:auto; border:1px solid var(--line); border-radius:10px; padding:8px; background:#fff;">
      ${forns.map(f=>`<label style="display:flex; gap:8px; align-items:center; margin:5px 0; font-weight:400; cursor:pointer;"><input type="checkbox" class="fuFornCk" value="${f.id}" style="width:18px; height:18px; margin:0; flex:0 0 auto;">${f.nome} <span class="muted" style="font-size:11px;">#${f.id}</span></label>`).join("")}
    </div>
    <label>Nome de quem vai acessar</label><input id="fuNome" placeholder="Ex: Carlos — D&D Angeiras">
    <label>PIN (6 dígitos)</label><input id="fuPin" inputmode="numeric" maxlength="6" type="password" placeholder="000000">
    <button class="btn-p" onclick="criarUsuarioFornecedor()">Criar acesso de fornecedor</button>
  </div>
  <div class="card">
    <h2>Usuários (${(allUsers||[]).length})</h2>
    <p class="muted" style="margin-bottom:8px;">Toque em qualquer usuário para editar função, loja, ativar/desativar ou trocar o PIN.</p>
    ${(allUsers||[]).map(u=>`<div class="item" onclick="go('usuario','${u.id}')" style="cursor:pointer; ${u.ativo?'':'opacity:.55'}"><div><div class="t">${u.nome} ${u.ativo?'':'<span class="badge" style="background:#78909C; font-size:10px;">INATIVO</span>'}</div><div class="s">${PAPEIS[u.papel]} · ${LOJAS[u.loja]||u.loja}</div></div><div style="color:var(--mut); font-size:20px;">›</div></div>`).join("")}
  </div>
  <div class="card">
    <h2>Produtos em acompanhamento (${(prods||[]).length})</h2>
    ${(prods||[]).map(p=>`<div class="item"><div><div class="t">${p.descricao}</div><div class="s">${p.ean}</div></div></div>`).join("")||'<p class="muted">Nenhum ainda — comece escaneando um produto na aba Contagem.</p>'}
  </div>`;
}

function vUsuario(id){
  return `<div class="card"><p class="muted center">Carregando…</p></div>`;
}
async function carregarUsuarioEdit(id){
  const {data:u,error} = await sb.from("usuarios").select("*").eq("id",id).single();
  if(error){ document.getElementById("view").innerHTML=`<div class="alertbox a-red">${error.message}</div>`; return; }
  const eu = sess && sess.id===u.id;
  if(u.papel==="fornecedor"){
    document.getElementById("view").innerHTML = `
    <div class="card">
      <h2>Acesso de fornecedor</h2>
      <label>Nome</label><input id="euNome" value="${u.nome.replace(/"/g,'&quot;')}">
      <p class="muted" style="margin-top:8px;">Vinculado ao fornecedor ID ${u.id_fornecedor||'?'} — vê apenas os próprios produtos e conta.</p>
      <button class="btn-p" onclick="salvarNomeFornecedor('${u.id}')">Salvar nome</button>
    </div>
    <div class="card">
      <h2>Trocar PIN</h2>
      <label>Novo PIN (6 dígitos)</label><input id="euPin" inputmode="numeric" maxlength="6" placeholder="000000" type="password">
      <button class="btn-s" onclick="resetarPinF('${u.id}')">Aplicar novo PIN</button>
    </div>
    ${u.ativo? `<div class="card"><h2>Desativar acesso</h2>
      <p class="muted">O fornecedor perde o acesso imediatamente. Histórico preservado.</p>
      <button class="btn-danger" onclick="desativarUsuario('${u.id}','${u.nome.replace(/'/g,"\\'")}')">Desativar ${u.nome}</button></div>`
    : `<div class="card"><h2>Acesso desativado</h2><button class="btn-s" onclick="reativarUsuario('${u.id}')">Reativar</button></div>`}`;
    return;
  }
  const isGestor = u.papel==="gestor";
  document.getElementById("view").innerHTML = `
  <div class="card">
    <h2>Editar usuário</h2>
    <label>Nome</label><input id="euNome" value="${u.nome.replace(/"/g,'&quot;')}">
    <div class="row">
      <div><label>Função</label><select id="euPapel" onchange="toggleEuLoja()">${Object.entries(PAPEIS).filter(([k])=>k!=="fornecedor").map(([k,v])=>`<option value="${k}" ${u.papel===k?'selected':''}>${v}</option>`).join("")}</select></div>
      <div><label>Loja</label>
        <select id="euLoja" ${isGestor?'disabled style="opacity:.5"':''}>
          ${Object.entries(LOJAS).map(([k,v])=>`<option value="${k}" ${u.loja===k?'selected':''}>${v}</option>`).join("")}
        </select>
        <div id="euLojaHint" class="muted" style="font-size:12px; margin-top:4px;">${isGestor?"Gestor tem acesso a todas as lojas":""}</div>
      </div>
    </div>
    ${eu?'<p class="muted" style="margin-top:12px;">⚠️ Este é o seu próprio usuário.</p>':''}
    <button class="btn-p" onclick="salvarUsuario('${u.id}')">Salvar alterações</button>
  </div>
  <div class="card">
    <h2>Trocar PIN</h2>
    <p class="muted">Deixe em branco para manter o PIN atual.</p>
    <label>Novo PIN (4 dígitos)</label><input id="euPin" inputmode="numeric" maxlength="4" placeholder="0000" type="password">
    <button class="btn-s" onclick="resetarPin('${u.id}')">Aplicar novo PIN</button>
  </div>
  ${u.ativo? `<div class="card">
    <h2>Desativar usuário</h2>
    <p class="muted">O usuário some da lista de login e não consegue mais entrar. O histórico de ações fica preservado (contagens, aplicações de preço, avais de pagamento continuam mostrando o nome dele).</p>
    <button class="btn-danger" onclick="desativarUsuario('${u.id}','${u.nome.replace(/'/g,"\\'")}')">Desativar ${u.nome}</button>
  </div>` : `<div class="card">
    <h2>Usuário desativado</h2>
    <p class="muted">Este usuário está inativo. Se quiser reativar:</p>
    <button class="btn-s" onclick="reativarUsuario('${u.id}')">Reativar usuário</button>
  </div>`}`;
}
function toggleEuLoja(){
  const p = document.getElementById("euPapel").value;
  const sel = document.getElementById("euLoja");
  const hint = document.getElementById("euLojaHint");
  if(p==="gestor"){ sel.disabled=true; sel.style.opacity=".5"; hint.textContent="Gestor tem acesso a todas as lojas"; }
  else { sel.disabled=false; sel.style.opacity="1"; hint.textContent=""; }
}
async function salvarNomeFornecedor(id){
  const nome=document.getElementById("euNome").value.trim();
  if(!nome) return alert("Informe o nome.");
  loading(true);
  try{ const {error} = await sb.from("usuarios").update({nome}).eq("id",id); if(error) throw error;
    alert("Nome atualizado."); goBack();
  }catch(e){ erroDB(e); }
  loading(false);
}
async function resetarPinF(id){
  const pin=document.getElementById("euPin").value.trim();
  if(!/^\d{6}$/.test(pin)) return alert("PIN precisa ter 6 dígitos.");
  if(!confirm("Confirmar troca do PIN deste fornecedor?")) return;
  loading(true);
  try{ const {error} = await sb.from("usuarios").update({pin_hash:await sha256(pin)}).eq("id",id); if(error) throw error;
    document.getElementById("euPin").value=""; alert("PIN atualizado. Avise o fornecedor.");
  }catch(e){ erroDB(e); }
  loading(false);
}
async function desativarUsuario(id, nome){
  if(!confirm(`Confirmar desativação de ${nome}?\n\nEle não conseguirá mais fazer login. O histórico de ações fica preservado.`)) return;
  loading(true);
  try{
    const {error} = await sb.from("usuarios").update({ativo:false}).eq("id",id);
    if(error) throw error;
    if(sess.id===id){ alert("Você desativou o próprio usuário — desconectando."); logout(); return; }
    alert("Usuário desativado.");
    goBack();
  }catch(e){ erroDB(e); }
  loading(false);
}
async function reativarUsuario(id){
  if(!confirm("Reativar este usuário?")) return;
  loading(true);
  try{
    const {error} = await sb.from("usuarios").update({ativo:true}).eq("id",id);
    if(error) throw error;
    alert("Usuário reativado.");
    goBack();
  }catch(e){ erroDB(e); }
  loading(false);
}
async function salvarUsuario(id){
  const nome=document.getElementById("euNome").value.trim();
  if(!nome) return alert("Informe o nome.");
  const dados = {nome, papel:document.getElementById("euPapel").value,
    loja:document.getElementById("euLoja").value};
  loading(true);
  try{
    const {error} = await sb.from("usuarios").update(dados).eq("id",id);
    if(error) throw error;
    if(sess.id===id) sess = {...sess, ...dados};
    alert("Alterações salvas.");
    goBack();
  }catch(e){ erroDB(e); }
  loading(false);
}
async function resetarPin(id){
  const pin=document.getElementById("euPin").value.trim();
  if(pin.length!==4 || !/^\d{4}$/.test(pin)) return alert("PIN precisa ter 4 dígitos.");
  if(!confirm("Confirmar troca do PIN deste usuário?")) return;
  loading(true);
  try{
    const {error} = await sb.from("usuarios").update({pin_hash:await sha256(pin)}).eq("id",id);
    if(error) throw error;
    document.getElementById("euPin").value="";
    alert("PIN atualizado. Avise o usuário do novo PIN.");
  }catch(e){ erroDB(e); }
  loading(false);
}

  try{ document.getElementById("view").insertAdjacentHTML("afterbegin",
    '<div class="alertbox a-red">⚠️ Erro: '+msg+' (linha '+line+')</div>'); }catch(e){}
  return false;
};
(async ()=>{
  try{
    const salvo = localStorage.getItem("dc_sess");
    if(salvo){
      const {id} = JSON.parse(salvo);
      const {data} = await sb.from("usuarios").select("*").eq("id",id).eq("ativo",true).maybeSingle();
      if(data){ sess=data; route={page:home(),param:null,prev:[]}; }
    }
  }catch(e){}
  render();
  if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
})();
