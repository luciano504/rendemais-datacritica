name: Sync Data Critica (VR -> App)

# Roda AQUI, no repo publico, porque minutos de Actions em repositorio publico
# sao gratuitos e ilimitados. O codigo continua privado no rendemais-pipeline:
# este workflow so faz checkout de la usando o secret PIPELINE_TOKEN.
# Substitui o workflow de mesmo nome que rodava no rendemais-pipeline.

on:
  schedule:
    # 07h e 16h de Recife (UTC-3) -> 10 e 19 em UTC
    - cron: "0 10,19 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-datacritica
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Baixar o pipeline (repo privado)
        uses: actions/checkout@v4
        with:
          repository: luciano504/rendemais-pipeline
          token: ${{ secrets.PIPELINE_TOKEN }}
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install pandas requests

      - name: Sincronizar VR -> Supabase
        env:
          VR_URL: ${{ secrets.VR_URL }}
        run: python scripts/sync_datacritica.py

      # A base de quem tem acesso de fornecedor entra sozinha: item com estoque
      # e venda nos ultimos 90 dias, cuja ultima entrada na loja veio dele.
      # Nao derruba o sync se falhar - o sync ja terminou aqui.
      - name: Expandir a base dos fornecedores cadastrados
        if: always()
        continue-on-error: true
        env:
          VR_URL: ${{ secrets.VR_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          DIAS_VENDA: "90"
        run: |
          if [ -f scripts/expandir_fornecedores.py ]; then
            python scripts/expandir_fornecedores.py
          else
            echo "scripts/expandir_fornecedores.py ainda nao esta no pipeline."
          fi
